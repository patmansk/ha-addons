name: Release on version change

on:
  push:
    branches:
      - main
    paths:
      - "radicale/config.yaml"
      - "radicale-decsync/config.yaml"

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - addon: radicale
            dir: radicale
          - addon: radicale-decsync
            dir: radicale-decsync
    steps:
      - uses: actions/checkout@v4

      - name: Get version from config.yaml
        id: version
        run: |
          VERSION=$(awk -F': *' '/^version:/ {print $2}' ${{ matrix.dir }}/config.yaml | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version for ${{ matrix.addon }}: $VERSION"

      - name: Validate version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::Version could not be extracted from ${{ matrix.dir }}/config.yaml"
            exit 1
          fi
          echo "Valid version: $VERSION"

      - name: Check if release already exists
        id: check
        run: |
          TAG="v${{ matrix.addon }}-${{ steps.version.outputs.version }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read changelog
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/^## ${VERSION}/{flag=1; next} /^## /{flag=0} flag" ${{ matrix.dir }}/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ matrix.addon }}-${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release_notes.md \
            --target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
